name: Build & Publish to GitHub Packages

on:
  push:
    branches: [ "main" ]     # change if your default branch is different
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version (e.g., 1.0.7). If empty, CI auto-increments patch."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"
  # Your Packages owner/namespace:
  NUGET_SOURCE_URL: "https://nuget.pkg.github.com/SURERAKESHKUMAR/index.json"

jobs:
  build-pack-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source "${{ env.NUGET_SOURCE_URL }}" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            for sln in *.sln; do
              dotnet restore "$sln"
            done
          else
            for proj in $(git ls-files '*.csproj'); do
              dotnet restore "$proj"
            done
          fi

      - name: Build
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            for sln in *.sln; do
              dotnet build "$sln" -c ${{ env.CONFIGURATION }} --no-restore
            done
          else
            for proj in $(git ls-files '*.csproj'); do
              dotnet build "$proj" -c ${{ env.CONFIGURATION }} --no-restore
            done
          fi

      # --------- VERSION: 1.0.X (X increments every run) ----------
      # If user supplies a version via workflow_dispatch, use it.
      # Else compute: 1.0.<run_number-1>
      - name: Compute version (1.0.X incremental)
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            BASE_MAJOR=1
            BASE_MINOR=0
            # run_number starts at 1; we want first = 0 → subtract 1
            PATCH=$(( $GITHUB_RUN_NUMBER - 1 ))
            if [ $PATCH -lt 0 ]; then PATCH=0; fi
            VERSION="${BASE_MAJOR}.${BASE_MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Pack (.nupkg) with forced version
        run: |
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget
          COUNT=0
          for proj in $(git ls-files '*.csproj'); do
            # Pack only library projects (skip apps)
            if grep -qi "<OutputType>Exe</OutputType>" "$proj"; then
              echo "Skipping app project: $proj"
              continue
            fi

            echo "Packing $proj with version ${{ steps.ver.outputs.version }}"
            dotnet pack "$proj" -c ${{ env.CONFIGURATION }} \
              /p:Version=${{ steps.ver.outputs.version }} \
              /p:RepositoryUrl=https://github.com/${{ github.repository }} \
              /p:RepositoryType=git \
              /p:PackageRequireLicenseAcceptance=false \
              --no-build \
              -o artifacts/nuget
            COUNT=$((COUNT+1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No library projects (.csproj) found to pack."
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for nupkg in artifacts/nuget/*.nupkg; do
            echo "Publishing $nupkg"
            dotnet nuget push "$nupkg" \
              --api-key "$GITHUB_TOKEN" \
              --source "github" \
              --skip-duplicate
          done

      # OPTIONAL: If you don't need DLL artifacts, remove the next two steps
      - name: Collect DLLs for artifacts
        run: |
          OUT_DIR="artifacts/dlls"
          mkdir -p "$OUT_DIR"
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            dest="$OUT_DIR/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done < <(find . -type d -name obj -prune -o -type f -path "*/bin/${{ env.CONFIGURATION }}/*" -name "*.dll" -print0)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dlls_and_packages
          path: |
            artifacts/dlls/**/*
            artifacts/nuget/**/*.nupkg
          if-no-files-found: warn
          retention-days: 7