name: Build & Publish to GitHub Packages (unique version each run)

on:
  push:
    branches: [ "main" ]        # adjust if needed
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g., 1.2.3 or 1.2.3-beta.1)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"
  # Set your feed owner here
  NUGET_SOURCE_URL: "https://nuget.pkg.github.com/SURERAKESHKUMAR/index.json"

jobs:
  build-pack-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source "${{ env.NUGET_SOURCE_URL }}" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            for sln in *.sln; do dotnet restore "$sln"; done
          else
            for proj in $(git ls-files '*.csproj'); do dotnet restore "$proj"; done
          fi

      - name: Build
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            for sln in *.sln; do dotnet build "$sln" -c ${{ env.CONFIGURATION }} --no-restore; done
          else
            for proj in $(git ls-files '*.csproj'); do dotnet build "$proj" -c ${{ env.CONFIGURATION }} --no-restore; done
          fi

      # >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
      # Compute an ALWAYS-UNIQUE SemVer for this run
      # - If manual 'version' is provided, use it as-is.
      # - Else create 0.1.0-ci.<run_number>.<shortsha>
      #   (SemVer 2 prerelease; safe for NuGet and always unique.)
      # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7 | tr '[:upper:]' '[:lower:]')"
            VERSION="0.1.0-ci.${{ github.run_number }}.${SHORT_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # Clean any old nupkg to avoid confusion; then pack with /p:Version
      - name: Pack (.nupkg) with forced version
        run: |
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget
          COUNT=0
          for proj in $(git ls-files '*.csproj'); do
            if grep -qi "<OutputType>Exe</OutputType>" "$proj"; then
              echo "Skipping app project: $proj"
              continue
            fi
            echo "Packing $proj with version ${{ steps.ver.outputs.version }}"
            dotnet pack "$proj" -c ${{ env.CONFIGURATION }} \
              /p:Version=${{ steps.ver.outputs.version }} \
              /p:RepositoryUrl=https://github.com/${{ github.repository }} \
              /p:RepositoryType=git \
              /p:PackageRequireLicenseAcceptance=false \
              --no-build \
              -o artifacts/nuget
            COUNT=$((COUNT+1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No library projects found to pack."
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for nupkg in artifacts/nuget/*.nupkg; do
            echo "Publishing $nupkg"
            dotnet nuget push "$nupkg" \
              --api-key "$GITHUB_TOKEN" \
              --source "github" \
              --skip-duplicate
          done
