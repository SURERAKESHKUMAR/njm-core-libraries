name: Build & Publish NuGet Packages (with Release Notes)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: "Release"
  OWNER: "SURERAKESHKUMAR"
  NUGET_SOURCE_URL: "https://nuget.pkg.github.com/SURERAKESHKUMAR/index.json"
  BASE_MAJOR: "1"
  BASE_MINOR: "0"

jobs:
  build-pack-publish:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- Setup ----------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ---------------- Auth ----------------
      - name: Configure GitHub Packages
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source "${{ env.NUGET_SOURCE_URL }}" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      # ---------------- Release Notes ----------------
      - name: Validate release.md
        run: |
          if [ ! -f release.md ]; then
            echo "❌ release.md not found!"
            exit 1
          fi

      - name: Print release notes
        run: |
          echo "========== RELEASE NOTES =========="
          cat release.md
          echo "=================================="

      # ---------------- Restore ----------------
      - name: Restore
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            for sln in *.sln; do dotnet restore "$sln"; done
          else
            for proj in $(git ls-files '*.csproj'); do dotnet restore "$proj"; done
          fi

      # ---------------- Build ----------------
      - name: Build
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            for sln in *.sln; do dotnet build "$sln" -c ${{ env.CONFIGURATION }} --no-restore; done
          else
            for proj in $(git ls-files '*.csproj'); do dotnet build "$proj" -c ${{ env.CONFIGURATION }} --no-restore; done
          fi

      # ---------------- Detect Changed Projects ----------------
      - name: Find changed projects
        id: changed
        run: |
          set -e

          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 || echo "")
          fi

          if [ -z "$BASE" ]; then
            git ls-files '*.csproj' > changed_projects.txt
          else
            git diff --name-only "$BASE" "${GITHUB_SHA}" > changed_files.txt || true
            : > changed_projects.txt
            while IFS= read -r proj; do
              dir="$(dirname "$proj")/"
              if grep -E "^${dir//\//\\/}" changed_files.txt | grep -vE "/(obj|bin)/" >/dev/null 2>&1; then
                echo "$proj" >> changed_projects.txt
              fi
            done < <(git ls-files '*.csproj')
          fi

          sort -u changed_projects.txt > tmp.txt && mv tmp.txt changed_projects.txt

          : > changed_library_projects.txt
          while IFS= read -r proj; do
            if grep -qi "<OutputType>Exe</OutputType>" "$proj"; then
              continue
            fi
            echo "$proj" >> changed_library_projects.txt
          done < changed_projects.txt

          COUNT=$(wc -l < changed_library_projects.txt || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      # ---------------- Install GitHub CLI ----------------
      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # ---------------- Pack & Publish ----------------
      - name: Pack & Publish Packages
        if: steps.changed.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p artifacts/nuget

          get_xml_value() {
            grep -oP "(?<=<$2>).*?(?=</$2>)" "$1" | head -1 || true
          }

          while IFS= read -r proj; do
            echo "Processing $proj"

            pkgId=$(get_xml_value "$proj" "PackageId")
            [ -z "$pkgId" ] && pkgId=$(basename "$proj" .csproj)

            # Get latest version
            resp=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/users/${OWNER}/packages/nuget/${pkgId}/versions")

            latest=$(echo "$resp" | jq -r '.[].name' 2>/dev/null \
              | grep -E "^${BASE_MAJOR}\.${BASE_MINOR}\.[0-9]+$" \
              | sed -E "s/^${BASE_MAJOR}\.${BASE_MINOR}\.//" \
              | sort -n | tail -1)

            [ -z "$latest" ] && latest=-1
            next=$((latest + 1))
            version="${BASE_MAJOR}.${BASE_MINOR}.${next}"

            echo "Version: $version"

            dotnet pack "$proj" -c $CONFIGURATION \
              /p:Version="$version" \
              --no-build \
              -o artifacts/nuget

            pkg="artifacts/nuget/${pkgId}.${version}.nupkg"

            dotnet nuget push "$pkg" \
              --source "github" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate

            # -------- Create Release --------
            tag="${pkgId}-v${version}"

            echo "Creating release $tag"

            gh release create "$tag" \
              --title "$pkgId v$version" \
              --notes-file release.md \
              || echo "Release exists"

          done < changed_library_projects.txt

      - name: No changes
        if: steps.changed.outputs.count == '0'
        run: echo "No library changes detected"
